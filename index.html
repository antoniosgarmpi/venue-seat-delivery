<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venue Seat Delivery prototype</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#1F2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seat Delivery">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Default theme (concerts and other events): red, white, soft gold on shades of black */
  --bg:#F4F2EE; --surface:#FFFFFF; --surface-2:#EFECE6; --ink:#1B1B1D; --ink-2:#5F5F66; --line:#DEDAD2;
  --brand:#C23B45; --brand-ink:#FFFFFF; --flood:#DDBF73; --flood-ink:#1B1B1D;
  --ok:#2F7A5B; --ok-bg:#E1EFE7; --warn:#7A5A12; --warn-bg:#F6ECCF; --bad:#9C2B34; --bad-bg:#F7E1E0;
  --accent:#C23B45; --accent-rgb:194,59,69; --deep:#1B1B1D; --deep-rgb:20,20,22;
  --top:var(--surface); --top-ink:var(--ink); --top-line:var(--line); --tab-bg:var(--surface-2); --tab-ink:var(--ink-2); --tab-on:var(--ink); --tab-on-ink:var(--surface);
  --tabc:var(--flood); --tabc-ink:var(--flood-ink); --top-btn:var(--line);
  --shadow:0 1px 2px rgba(20,20,22,.06),0 8px 24px rgba(20,20,22,.07);
  --display:"Fira Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F0F11; --surface:#1A1A1D; --surface-2:#252529; --ink:#EFEBE3; --ink-2:#A9A9B0; --line:#37373D;
    --brand:#E0707A; --brand-ink:#1A1012; --flood:#D9BC74; --flood-ink:#1A1A1D;
    --ok:#7FCBA4; --ok-bg:#1B3329; --warn:#E3C77D; --warn-bg:#3A311C; --bad:#F09AA0; --bad-bg:#45212A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F0F11; --surface:#1A1A1D; --surface-2:#252529; --ink:#EFEBE3; --ink-2:#A9A9B0; --line:#37373D;
  --brand:#E0707A; --brand-ink:#1A1012; --flood:#D9BC74; --flood-ink:#1A1A1D;
  --ok:#7FCBA4; --ok-bg:#1B3329; --warn:#E3C77D; --warn-bg:#3A311C; --bad:#F09AA0; --bad-bg:#45212A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
/* Home team theme (sports events): the home team's red and white */
:root[data-brand="team"]{
  --bg:#FBF6F6; --surface:#FFFFFF; --surface-2:#F7ECEC; --ink:#2A1418; --ink-2:#6F575B; --line:#EDDADB;
  --brand:#D1102B; --brand-ink:#FFFFFF; --flood:#D1102B; --flood-ink:#FFFFFF;
  --bad:#7A1F2B; --bad-bg:#F9E3E5;
  --accent:#D1102B; --accent-rgb:209,16,43; --deep:#2A1418; --deep-rgb:52,10,16;
  --top:#D1102B; --top-ink:#FFFFFF; --top-line:#B50D24; --tab-bg:rgba(255,255,255,.18); --tab-ink:rgba(255,255,255,.92); --tab-on:#FFFFFF; --tab-on-ink:#B50D24;
  --tabc:#2A1418; --tabc-ink:#FFFFFF; --top-btn:rgba(255,255,255,.6);
  --shadow:0 1px 2px rgba(52,10,16,.06),0 8px 24px rgba(52,10,16,.08);
}
@media (prefers-color-scheme: dark){
  :root[data-brand="team"]:not([data-theme="light"]){
    --bg:#140B0C; --surface:#1F1213; --surface-2:#2B191B; --ink:#F3ECEC; --ink-2:#BDA9AB; --line:#40282B;
    --brand:#F04A5E; --brand-ink:#22080C; --flood:#D1102B; --flood-ink:#FFFFFF;
    --ok:#7FCBA4; --ok-bg:#1B3329; --warn:#E3C77D; --warn-bg:#3A311C; --bad:#F2A0A8; --bad-bg:#4A1D25;
    --top:#B50D24; --top-ink:#FFFFFF; --top-line:#8E0A1C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-brand="team"][data-theme="dark"]{
  --bg:#140B0C; --surface:#1F1213; --surface-2:#2B191B; --ink:#F3ECEC; --ink-2:#BDA9AB; --line:#40282B;
  --brand:#F04A5E; --brand-ink:#22080C; --flood:#D1102B; --flood-ink:#FFFFFF;
  --ok:#7FCBA4; --ok-bg:#1B3329; --warn:#E3C77D; --warn-bg:#3A311C; --bad:#F2A0A8; --bad-bg:#4A1D25;
  --top:#B50D24; --top-ink:#FFFFFF; --top-line:#8E0A1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--top)}
h1,h2,h3,p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--flood);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--top);color:var(--top-ink);border-bottom:1px solid var(--top-line);transition:background .25s;
  display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.brand{font:700 22px/1 var(--display);letter-spacing:.01em;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 13px/1 var(--body);opacity:.7}
.top>.btn{background:transparent;color:var(--top-ink);border-color:var(--top-btn)}
.top :focus-visible{outline-color:var(--top-ink)}
.roles{display:flex;gap:2px;background:var(--tab-bg);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
.roles button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:600;white-space:nowrap;color:var(--tab-ink);display:flex;align-items:center;gap:6px}
.roles button[aria-current="true"]{background:var(--tab-on);color:var(--tab-on-ink)}
.roles .count{background:var(--tabc);color:var(--tabc-ink)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--flood);color:var(--flood-ink);font:700 13px/20px var(--body);text-align:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.go{background:var(--flood);border-color:var(--flood);color:var(--flood-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.code{font:700 20px/1 var(--display);letter-spacing:.04em;padding:12px 16px}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.stage{padding:16px;max-width:1280px;margin:0 auto}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.right{margin-left:auto}

/* phone frame for customer + runner */
.phone{max-width:430px;margin:0 auto;background:var(--surface);min-height:calc(100vh - 110px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:clip}
.phone-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.phone-body{padding:16px;flex:1}
.phone-nav{margin-top:auto;position:sticky;bottom:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.phone-nav button{border:0;background:none;padding:12px 4px;font-weight:600;color:var(--ink-2);display:flex;justify-content:center;align-items:center;gap:6px;min-height:52px}
.phone-nav button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--flood)}
@media (max-width:520px){
  .top{padding:8px 12px;gap:8px}
  .roles{order:3;width:100%}
  .roles button{flex:1;justify-content:center;padding:8px 6px}
  .stage{padding:0}
  .phone{border:0;border-radius:0;box-shadow:none;max-width:none;min-height:calc(100vh - 100px)}
  .wide{padding:12px}
}
h1.t{font:700 30px/1.05 var(--display);letter-spacing:.005em}
h2.t{font:700 22px/1.1 var(--display)}
h3.t{font:600 17px/1.2 var(--body)}

/* seat plate: the signature element */
.plate{display:inline-grid;grid-auto-flow:column;gap:3px;font-family:var(--display);vertical-align:middle}
.plate span{background:var(--flood);color:var(--flood-ink);padding:5px 10px 4px;min-width:54px;display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.plate span:first-child{border-radius:7px 0 0 7px}
.plate span:last-child{border-radius:0 7px 7px 0}
.plate i{font:600 11px/1 var(--body);font-style:normal;opacity:.75}
.plate b{font-size:26px;font-weight:700;margin-top:2px}
.plate.big span{padding:10px 16px 8px;min-width:86px}
.plate.big b{font-size:52px}
.plate.big i{font-size:13px}
.plate.sm span{padding:3px 7px;min-width:40px}
.plate.sm b{font-size:18px}
.plate.sm i{font-size:10px}
.plate.hidden span{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line) 6px 12px);color:var(--ink-2)}
.plate.reveal span{animation:flip .5s cubic-bezier(.2,.8,.2,1) both}
.plate.reveal span:nth-child(2){animation-delay:.12s}
.plate.reveal span:nth-child(3){animation-delay:.24s}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.plate.reveal span{animation:none}}

.pill{display:inline-block;padding:3px 9px;border-radius:999px;font:600 13px/1.3 var(--body);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.flood{background:var(--flood);color:var(--flood-ink)}
.note{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.demo{border:1px dashed var(--line);background:none;color:var(--ink-2)}

.field{display:block}
.field>span{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.field input,.field select,.field textarea,select.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
.field textarea{min-height:72px;resize:vertical}
.seatpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qr{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px}
.qr svg{width:112px;height:112px;flex:none;background:#fff;border-radius:6px;padding:6px}
.otp{font:700 30px/1 var(--display);letter-spacing:.3em}

.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.vend{width:100%;text-align:left;border:0;background:none;padding:0;display:flex;align-items:center;gap:12px}
.vend:disabled{opacity:.55;cursor:not-allowed}
.mark{flex:none;width:44px;height:44px;border-radius:10px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:700 20px/1 var(--display)}
.price{font:600 17px/1 var(--display);white-space:nowrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.stepper button{border:0;background:none;width:40px;height:40px;font-size:20px;font-weight:600}
.stepper b{min-width:26px;text-align:center}
.check{display:flex;align-items:center;gap:10px;padding:8px 0}
.check input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:600;min-height:44px}
.pay button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;font:700 24px/1 var(--display);padding-top:12px;border-top:2px solid var(--ink)}

/* order cards */
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px}
.card+.card{margin-top:12px}
.ono{font:700 22px/1 var(--display);letter-spacing:.02em}
.lines{list-style:none;margin:8px 0;padding:0;font-size:15px}
.lines li{padding:2px 0}
.lines em{color:var(--ink-2);font-style:normal}
.lines .n{display:block;margin-top:2px;padding:4px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin:10px 0 6px;list-style:none;padding:0}
.steps li{font-size:11.5px;color:var(--ink-2);padding-top:8px;border-top:4px solid var(--line);line-height:1.2}
.steps li.done{border-color:var(--ok);color:var(--ink)}
.steps li.now{border-color:var(--flood);color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* vendor + admin (wide) */
.wide{max-width:1280px;margin:0 auto}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 12px;font-weight:600;font-size:14px;min-height:40px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:10px 0;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-current="true"]{color:var(--ink);border-color:var(--flood)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.board{grid-template-columns:1fr}}
.col{background:var(--surface-2);border-radius:14px;padding:10px;min-height:120px}
.col>h3{font:700 18px/1 var(--display);padding:4px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.empty{padding:14px 6px;color:var(--ink-2);font-size:14px}
.panel{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel+.panel{margin-top:14px}
.panel>h2{font:700 20px/1.1 var(--display);margin-bottom:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--ink-2);font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.stats div{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stats dt{font-size:13px;color:var(--ink-2)}
.stats dd{margin:4px 0 0;font:700 30px/1 var(--display)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.grid2>.panel{margin-top:0}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chart{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:160px;padding-top:18px}
.chart div{background:var(--brand);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.chart div b{position:absolute;top:-18px;left:0;right:0;text-align:center;font:600 12px/1 var(--body);color:var(--ink-2)}
.chart-x{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;font-size:11px;color:var(--ink-2);text-align:center;margin-top:4px}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.ladder div{padding:8px 4px;text-align:center;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.ladder div b{display:block;font:700 20px/1 var(--display);color:var(--ink)}
.ladder div.hit{background:var(--flood);color:var(--flood-ink)}
.ladder div.hit b{color:var(--flood-ink)}
.log{list-style:none;margin:0;padding:0;font-size:14px;max-height:320px;overflow:auto}
.log li{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.log time{color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums}
.log li.win{font-weight:600}
.log li.lose{color:var(--bad)}

/* modal / sheet */
.veil{position:fixed;inset:0;background:rgba(var(--deep-rgb),.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:560px){.veil{align-items:center}.sheet{border-radius:20px}}
.sheet.wide-sheet{max-width:620px}
.sheet h2{font:700 24px/1.1 var(--display);margin-bottom:6px}
.toasts{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:100%}
.toast.bad{background:var(--bad);color:var(--surface)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch button{flex:none;width:52px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--surface-2);position:relative}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink-2);transition:transform .15s}
.switch button[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.switch button[aria-checked="true"]::after{transform:translateX(22px);background:#fff}
ol.how{margin:8px 0 0;padding-left:20px}
ol.how li{margin:4px 0}

/* ---------- customer app ---------- */
body.locked{overflow:hidden}
.cust .phone-body{padding:16px 16px 24px}
.cust h1.t{font:700 26px/1.15 var(--body);letter-spacing:-.01em}
.cust h2.t{font:700 19px/1.2 var(--body)}
.cust .sec{margin:22px 0 10px}
.cust .row.sec{margin:16px 0 2px}
.cust .price,.sheet .price{font:700 16px/1.2 var(--body)}
.btn.big{min-height:54px;font-size:17px;border-radius:14px}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:20px;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:14px;padding:0 14px;min-height:48px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;padding:12px 0}
.search:focus-within{outline:3px solid var(--flood);outline-offset:1px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14.5px;min-height:40px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.hero{margin-top:14px;border-radius:18px;min-height:156px;background:var(--deep) center/cover no-repeat;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.hero>div{width:100%;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(var(--deep-rgb),.9))}
.hero b{display:block;font:700 24px/1.1 var(--body)}
.hero span{font-size:14.5px}
.livecard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:18px;background:var(--ink);color:var(--surface);padding:14px 16px;margin-top:14px;min-height:72px}
.bigemoji{font-size:34px;line-height:1;flex:none}
.bob{animation:bob 1.4s ease-in-out infinite}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none}
.pcard{flex:none;width:136px;display:flex;flex-direction:column;gap:2px;scroll-snap-align:start}
.pcard b{font-size:15px;line-height:1.2;margin-top:6px}
.pcard .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pthumb{position:relative;display:block;flex:none}
.ph{display:block;width:100%;aspect-ratio:1;border-radius:16px;background:#fff center/cover no-repeat;border:1px solid var(--line)}
.ph[data-action]{cursor:pointer}
.plus{position:absolute;right:6px;bottom:6px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:var(--accent);font:700 22px/1 var(--body);box-shadow:0 2px 8px rgba(var(--deep-rgb),.28);display:grid;place-items:center}
.plus.has{background:var(--accent);color:#fff;font-size:16px}
.plus.pop,.bbar.pop{animation:pop .35s}
.plist>li.prow{align-items:stretch;gap:12px;padding:14px 0}
.prow .pthumb{width:104px}
.prow.off{opacity:.55}
.pmain{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.pmain b{font-size:16.5px;line-height:1.25}
.pmain .price{margin-top:auto;padding-top:6px}
.pdesc{color:var(--ink-2);font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stores{display:grid;gap:14px}
.scard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;overflow:hidden;padding:0}
.scard:disabled{opacity:.6;cursor:not-allowed}
.cover{display:block;height:132px;background:var(--deep) center/cover no-repeat;position:relative}
.badges{position:absolute;left:10px;bottom:10px}
.sbody{display:flex;flex-direction:column;gap:2px;padding:12px 14px 14px}
.sbody b{font-size:18px}
.smeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--ink-2);margin-top:4px}
.shero{height:170px;margin:-16px -16px 0;background:var(--deep) center/cover no-repeat;position:relative}
.back{position:absolute;left:12px;top:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#1B1B1D;font-size:19px;box-shadow:0 2px 8px rgba(var(--deep-rgb),.28);display:grid;place-items:center}
.back.flat{position:static;box-shadow:none;background:var(--surface-2);color:var(--ink);flex:none}
.dock{margin-top:auto;position:sticky;bottom:0;z-index:5}
.dock .phone-nav{position:static;margin:0}
.bbar{display:flex;align-items:center;gap:10px;width:calc(100% - 24px);margin:0 12px 10px;border:0;border-radius:14px;background:var(--accent);color:#fff;padding:12px 16px;font-weight:700;font-size:16px;min-height:52px;text-align:left;box-shadow:0 6px 18px rgba(var(--accent-rgb),.35)}
.bbar .count{background:rgba(255,255,255,.24);color:#fff}
.list>li.cline{align-items:flex-start}
.cthumb{position:relative;flex:none;width:56px;display:block}
.cthumb .ph{border-radius:12px}
.cthumb i{position:absolute;right:-5px;top:-5px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--ink);color:var(--surface);font:700 12px/20px var(--body);text-align:center;font-style:normal}
.thumbs{display:flex;gap:8px;margin:12px 0;align-items:center}
.thumbs .cthumb{width:46px}
.more{font-weight:600;color:var(--ink-2)}
.sum{margin:0;border-top:1px solid var(--line);padding-top:10px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.sum dt{color:var(--ink-2)}
.sum dd{margin:0;text-align:right;font-weight:600}
.sum .grand{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-size:20px}
.sum .grand dt{color:var(--ink);font-weight:700}
.sum .grand dd{font-weight:700}
.track{border-radius:18px;padding:16px}
.track.live{border-color:var(--flood);box-shadow:inset 0 0 0 1px var(--flood)}
.tt{font:700 18px/1.2 var(--body)}
.etaline{margin-top:12px;font-size:15px}
.etaline b{font-size:17px}
.pbar{position:relative;height:8px;border-radius:4px;background:var(--surface-2);margin:28px 10px 8px}
.pbar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--brand);transition:width .6s}
.pbar span{position:absolute;top:-24px;font-size:22px;line-height:1;transform:translateX(-50%) scaleX(-1);transition:left .6s}
.pstops{display:flex;justify-content:space-between;list-style:none;margin:0;padding:0;font-size:12px;color:var(--ink-2)}
.runner{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:10px 12px;margin-top:12px}
.stars{display:flex;align-items:center;margin-top:8px}
.stars span{margin-right:8px}
.stars button{border:0;background:none;font-size:28px;line-height:1;color:var(--line);padding:2px;min-width:38px;min-height:42px}
.stars:hover button,.stars:focus-within button{color:var(--flood)}
.stars button:hover~button,.stars button:focus-visible~button{color:var(--line)}
.emptyst{text-align:center;padding:40px 8px}
.emptyst .bigemoji{font-size:56px;display:block}
.paying{position:fixed;inset:0;z-index:25;background:rgba(var(--deep-rgb),.88);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
.scanbox{position:relative;width:190px;height:190px;margin:8px auto 4px;padding:16px;border-radius:24px;background:#fff;box-shadow:0 0 0 4px var(--flood)}
.scanbox svg{width:100%;height:100%;display:block}
.scanbox i{position:absolute;left:10px;right:10px;top:14px;height:3px;border-radius:2px;background:var(--accent);opacity:0}
.scanbox.scanning i{opacity:1;animation:scan .65s ease-in-out}
.field input.otpin{font:700 28px/1 var(--body);letter-spacing:.5em;text-align:center}
.sheet.flush{padding:0}
.mhero{height:230px;background:#fff center/var(--fit,contain) no-repeat;position:relative}
.mbody{padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{from{top:14px}to{top:172px}}
@media (prefers-reduced-motion:reduce){.bob,.plus.pop,.bbar.pop,.scanbox.scanning i,.spinner{animation:none}.pbar i,.pbar span{transition:none}}
#net-badge{position:fixed;left:8px;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:15;font:500 11px/1 var(--body);padding:5px 9px;border-radius:999px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);box-shadow:var(--shadow);pointer-events:none;opacity:.92}
#net-badge[data-state=live]{color:var(--ok)}#net-badge[data-state=offline]{color:var(--bad)}
.roles[hidden],.roles button[hidden],#demo-btn[hidden],#acct-btn[hidden]{display:none!important}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--top-btn);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px 3px 3px;font:inherit;cursor:pointer;max-width:220px;margin-left:auto}
.acct .av{width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:600 12px/1 var(--display);flex:none}
.acct-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.acct-txt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}.acct-txt small{font-size:11px;color:var(--ink-2)}
</style>

    const vid=weighted(rnd,[['grill',.32],['bar',.42],['cafe',.22],['fan',.04]],x=>x[1])[0];
    const v=vendorOf(vid), out=rnd();

/* ---------- cloud sync (Supabase) ----------
   Shared state (stores, stock, runners, orders, log) lives in one database row per room.
   Per-phone state (who I am, my basket, my autopilot switches) stays on the phone.
   Every save says "I'm building on revision N"; the database only accepts it if the row is
   still at N. If someone else saved first, we fetch their version and re-run our action on it,
   so "first valid ACCEPT wins" holds across phones. */
const CFG=window.VSD_CONFIG||{};
const LOCAL_KEYS=['customer','runnerId','vendorId','auto'];

let CLOUD=!!sb, serverRev=null, pending=[], pushing=false, netState=sb?'connecting':'local';
function sharedPart(st){const o={};for(const k in st)if(!LOCAL_KEYS.includes(k))o[k]=st[k];return o;}
function sharedSig(st){const o=sharedPart(st);delete o.rev;return JSON.stringify(o);}
function applyRemote(row){const keep={};LOCAL_KEYS.forEach(k=>keep[k]=S[k]);S=Object.assign(row.data,keep);serverRev=row.rev;S.rev=row.rev;}
function setNet(n){netState=n;const b=document.getElementById('net-badge');if(!b)return;
  b.textContent=n==='live'?'● Live · room '+ROOM:n==='connecting'?'○ Connecting…':n==='offline'?'● Offline, retrying':'● This phone only';b.dataset.state=n;}
async function fetchRow(){const {data,error}=await sb.from('app_state').select('rev,data').eq('id',ROOM).maybeSingle();if(error)throw error;return data;}
function lostRace(r){return r===false||(r&&typeof r==='object'&&r.ok===false);}
async function flush(){
  if(!CLOUD||pushing||serverRev===null||!pending.length)return; pushing=true;
  try{
    while(pending.length){
      const n=pending.length, data=sharedPart(S); data.rev=serverRev+1;
      const {data:ok,error}=await sb.rpc('save_state',{p_id:ROOM,p_expected_rev:serverRev,p_data:data});
      if(error)throw error;
      if(ok){serverRev=data.rev;pending.splice(0,n);S.rev=serverRev+pending.length;}
      else{ /* someone else saved first: take theirs and re-run our pending actions on top */
        const row=await fetchRow(); if(!row)throw new Error('Room row missing');
        const fns=pending.slice(); applyRemote(row);
        const res=fns.map(f=>f()); S.rev=serverRev+fns.length; save(); render();
        const last=res[res.length-1]; if(lostRace(last))toast(last&&last.msg?last.msg:'Someone else got there first. Screen updated.',true);
      }
    }
    setNet('live');
  }catch(e){console.warn('Sync failed',e);setNet('offline');pushing=false;setTimeout(flush,3000);return;}
  pushing=false;
}
function commit(fn,quiet){

}

async function cloudBoot(){
  try{
    let row=await fetchRow();
    if(!row){const data=sharedPart(S);data.rev=1;const {error}=await sb.rpc('save_state',{p_id:ROOM,p_expected_rev:null,p_data:data});if(error)throw error;row=await fetchRow();}
    applyRemote(row); pending.forEach(f=>f()); S.rev=serverRev+pending.length; save(); render(); setNet('live'); flush();
    sb.channel('room-'+ROOM).on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'id=eq.'+ROOM},async p=>{
      if(pending.length||pushing||!p.new||!(p.new.rev>serverRev))return;
      try{const r=(p.new.data&&typeof p.new.data==='object')?p.new:await fetchRow(); if(r&&r.rev>serverRev&&!pending.length&&!pushing){applyRemote(r);save();render();}}catch(e){}
    }).subscribe();
    /* safety net if realtime is blocked on some network: a light check every 4 seconds */
    setInterval(async()=>{if(pending.length||pushing)return;
      try{const {data,error}=await sb.from('app_state').select('rev').eq('id',ROOM).maybeSingle();if(error)throw error;
        if(data&&data.rev>serverRev){const r=await fetchRow();if(r&&!pending.length&&!pushing){applyRemote(r);save();render();}}
        if(netState!=='live')setNet('live');}catch(e){setNet('offline');}},4000);
  }catch(e){console.warn('Cloud not reachable yet',e);setNet('offline');setTimeout(cloudBoot,5000);}
}

const getOrder=id=>S.orders.find(o=>o.id===id);
function canOrder(vid){const v=S.vendors[vid];return v.status!=='CLOSED'&&!(v.stopAt&&Date.now()>=v.stopAt);}
function setVendorStatus(vid,mode){
  const v=S.vendors[vid], name=vendorOf(vid).name;
  if(mode==='OPEN'){v.status='OPEN';v.stopAt=null;}
  else if(mode==='CLOSED'){v.status='CLOSED';v.stopAt=null;}
  else{v.status='CLOSING_SOON';v.stopAt=Date.now()+(mode==='STOP30'?30:60)*MIN;}
  logEv(name+' set to '+(v.status==='CLOSING_SOON'?'CLOSING SOON, last orders '+clock(v.stopAt):v.status));
}
function toggleStock(itemId){
  if(S.soldOut[itemId]){delete S.soldOut[itemId];logEv(itemOf(itemId).name+' is available again');}
  else{S.soldOut[itemId]=true;S.stockEvents++;logEv(itemOf(itemId).name+' marked SOLD OUT');}
}
function placeOrders(cart,seat,session,pay){
  const by={}; cart.forEach(l=>{const it=itemOf(l.itemId);(by[it.v]=by[it.v]||[]).push({itemId:it.id,name:it.name,qty:l.qty,unit:l.unit,mods:l.mods.slice(),note:l.note||''});});
  const ids=[];
  Object.keys(by).forEach(vid=>{const o=newOrder(S,vid,seat,by[vid],{session,pay});o.id=pad(S.seq++,5);S.orders.push(o);ids.push(o.id);
    logEv('Order #'+o.id+' paid ('+eur(o.total)+') and sent to '+vendorOf(vid).name);});
  return ids;
}
function vendorStep(id,to){
  const o=getOrder(id); if(!o)return false; const now=Date.now();
  if(to==='ACCEPTED'&&o.status==='PLACED'){o.status='ACCEPTED';o.tAccepted=now;logEv('#'+id+' accepted by '+vendorOf(o.vid).name);return true;}
  if(to==='PREPARING'&&o.status==='ACCEPTED'){o.status='PREPARING';o.tPreparing=now;return true;}
  if(to==='READY'&&(o.status==='PREPARING'||o.status==='ACCEPTED')){o.status='READY';o.tReady=now;logEv('#'+id+' is READY TO GO at '+vendorOf(o.vid).name);return true;}
  if(to==='CANCELLED'&&o.status==='PLACED'){o.status='CANCELLED';o.tCancelled=now;logEv('#'+id+' rejected by '+vendorOf(o.vid).name+', '+eur(o.total)+' refunded');return true;}
  if(to==='RETURNED'&&o.status==='FAILED'){o.status='RETURNED';o.tReturned=now;logEv('#'+id+' return confirmed by '+vendorOf(o.vid).name+', Runner #'+o.runner+' is free');return true;}
  if(to==='COLLECTED'&&o.status==='RETURNED'){o.status='COLLECTED';o.tCollected=now;logEv('#'+id+' collected by the customer at '+vendorOf(o.vid).name);return true;}
  return false;
}
function vendorDelay(id,min){const o=getOrder(id);if(!o||!['ACCEPTED','PREPARING'].includes(o.status))return false;o.delay+=min;logEv('#'+id+' delayed by '+min+' min at '+vendorOf(o.vid).name);return true;}
const runnerActive=rid=>S.orders.find(o=>o.runner===rid&&ACTIVE_RUN.includes(o.status));
/* First valid ACCEPT wins: the check and the write happen in one synchronous step. */
function runnerAccept(id,rid){
  const o=getOrder(id);
  if(!S.runners[rid]||!S.runners[rid].onShift)return {ok:false,msg:'Go on shift to accept orders'};
  if(runnerActive(rid))return {ok:false,msg:'Finish your current delivery first'};
  if(!o||o.status!=='READY'||o.runner){logEv('Runner #'+rid+' ACCEPT on #'+id+': order no longer available','lose');return {ok:false,msg:'Order no longer available'};}
  o.status='ASSIGNED';o.runner=rid;o.tAssigned=Date.now();
  logEv('Runner #'+rid+' ACCEPT on #'+id+': ASSIGNED, seat revealed','win');
  return {ok:true};
}
function runnerStep(id,rid,to,reason){
  const o=getOrder(id); if(!o||o.runner!==rid)return false; const now=Date.now();
  if(to==='PICKED_UP'&&o.status==='ASSIGNED'){o.status='PICKED_UP';o.tPicked=now;logEv('#'+id+' picked up by Runner #'+rid);return true;}
  if(to==='DELIVERED'&&o.status==='PICKED_UP'){o.status='DELIVERED';o.tDone=now;logEv('#'+id+' delivered to '+seatStr(o.seat)+' by Runner #'+rid);return true;}
  if(to==='FAILED'&&o.status==='PICKED_UP'){o.status='FAILED';o.tFailed=now;o.failReason=reason||'Other';logEv('#'+id+' delivery failed ('+o.failReason+'), going back to '+vendorOf(o.vid).name,'lose');return true;}
  return false;
}
function etaAt(o){return o.tPlaced+(vendorOf(o.vid).prep+DELIVERY_EST+o.delay)*MIN;}

/* ---------- metrics ---------- */
function runnerStats(rid){
  const mine=S.orders.filter(o=>o.runner===rid), done=mine.filter(o=>o.status==='DELIVERED'), failed=mine.filter(o=>o.tFailed);
  const completed=done.length, f=failed.length, rate=completed+f?completed/(completed+f):null;
  let tier=null; BONUS.forEach(b=>{if(completed>=b[0])tier=b;});
  const eligible=rate==null||rate>=.9;
  return {rid,accepted:mine.length,completed,failed:f,rate,avgDelivery:avg(done.map(o=>o.tDone-o.tAssigned)),avgPickup:avg(mine.filter(o=>o.tPicked).map(o=>o.tPicked-o.tAssigned)),tier,eligible,bonus:tier&&eligible?tier[1]:0};
}
function leaderboard(){
  const rows=RUNNERS.map(r=>runnerStats(r.id));
  rows.sort((a,b)=>b.completed-a.completed||(a.avgDelivery||9e15)-(b.avgDelivery||9e15));
  rows.forEach((r,i)=>r.rank=i+1); return rows;
}

function sellers(){

function peaks(){
  const size=15*MIN, n=12, end=Math.ceil(Date.now()/size)*size, start=end-n*size, b=Array.from({length:n},(_,i)=>({t:start+i*size,n:0}));

function genLive(n){

function simulateRace(){
  let free=RUNNERS.map(r=>r.id).filter(id=>S.runners[id].onShift&&!runnerActive(id));
  const others=free.filter(id=>id!==S.runnerId); if(others.length>=2)free=others;
  if(free.length<2)return {err:'The race needs at least two free runners on shift.'};
  let o=S.orders.find(x=>x.status==='READY'&&!x.runner);
  if(!o){const rnd=mulberry32(Date.now()&0xffffff), now=Date.now();
    o=newOrder(S,'bar',randomSeat(rnd),randomLines('bar',rnd),{sim:true,status:'READY',tPlaced:now-4*MIN,tAccepted:now-3.5*MIN,tPreparing:now-3*MIN,tReady:now});
    o.id=pad(S.seq++,5);S.orders.push(o);}
  for(let i=free.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[free[i],free[j]]=[free[j],free[i]];}
  const racers=free.slice(0,3);
  o.auto=true;
  return {order:o.id,results:racers.map(rid=>({rid,res:runnerAccept(o.id,rid)}))};
}
/* Autopilot: lets one person demo a single role while the others move on their own. */
function autoStep(){
  const now=Date.now(); let ch=false;
  VENDORS.forEach(v=>{const st=S.vendors[v.id];if(st.status==='CLOSING_SOON'&&st.stopAt&&now>=st.stopAt){st.status='CLOSED';st.stopAt=null;logEv(v.name+' stopped taking orders');ch=true;}});
  if(S.auto.vendors){
    S.orders.forEach(o=>{
      if(o.status==='PLACED'&&now-o.tPlaced>3000)ch=vendorStep(o.id,'ACCEPTED')||ch;
      else if(o.status==='ACCEPTED'&&now-o.tAccepted>2500)ch=vendorStep(o.id,'PREPARING')||ch;
      else if(o.status==='PREPARING'&&now-o.tPreparing>6000)ch=vendorStep(o.id,'READY')||ch;
      else if(o.status==='FAILED'&&now-o.tFailed>5000)ch=vendorStep(o.id,'RETURNED')||ch;
    });
  }
  S.orders.forEach(o=>{
      if(!o.runner||o.runner===S.runnerId||!(S.auto.runners||o.auto))return;
      if(o.status==='ASSIGNED'&&now-o.tAssigned>4000)ch=runnerStep(o.id,o.runner,'PICKED_UP')||ch;
      else if(o.status==='PICKED_UP'&&now-o.tPicked>6000)ch=runnerStep(o.id,o.runner,'DELIVERED')||ch;
  });
  if(S.auto.runners){
    const ready=S.orders.filter(o=>o.status==='READY'&&!o.runner&&now-o.tReady>3000).sort((a,b)=>a.tReady-b.tReady)[0];
    if(ready){const rid=RUNNERS.map(r=>r.id).find(id=>id!==S.runnerId&&S.runners[id].onShift&&!runnerActive(id));
      if(rid&&runnerAccept(ready.id,rid).ok)ch=true;}
  }
  return ch;
}

function qrSvg(str){
  let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  const rnd=mulberry32(h), n=21, cells=[]; const finder=(x,y)=>(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    let on;
    if(finder(x,y)){const fx=x<7?x:x-(n-7), fy=y<7?y:y-(n-7);on=fx===0||fx===6||fy===0||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4);}
    else on=rnd()<.48;
    if(on)cells.push('<rect x="'+x+'" y="'+y+'" width="1" height="1"/>');
  }
  return '<svg viewBox="0 0 21 21" shape-rendering="crispEdges" fill="#1B1B1D" aria-hidden="true">'+cells.join('')+'</svg>';
}

      linesHtml(active)+'<button class="btn go code block" data-action="r-step" data-id="'+active.id+'" data-to="PICKED_UP">PICKED UP</button></div>';

      '<table style="margin-top:10px"><tbody>'+o.lines.map(l=>'<tr><td style="white-space:normal">'+l.qty+' × '+esc(l.name)+(l.mods.length?' <span class="muted">('+esc(l.mods.join(', ').toLowerCase())+')</span>':'')+'</td><td class="num">'+eur(l.qty*l.unit)+'</td></tr>').join('')+'</tbody></table>'+

  }

/* ---------- render ---------- */
const ROLES=['customer','vendor','runner','venue'];
let lastApp='', lastModal='';
function applyBrand(){
  const el=document.documentElement, want=S.team?'team':'';
  if((el.dataset.brand||'')!==want){if(want)el.dataset.brand=want;else delete el.dataset.brand;
    const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',S.team?'#D1102B':'#1B1B1D');}
}
function render(){
  applyBrand();
  const app=document.getElementById('app'), html=AUTH==='signin'?vSignIn():AUTH==='loading'?'<div class="phone"><div class="phone-body"><p class="muted">Signing in…</p></div></div>':U.role==='vendor'?vVendor():U.role==='runner'?vRunner():U.role==='venue'?vAdmin():vCustomer(), mh=AUTH==='in'||AUTH==='off'?vModal():'';
  if(html!==lastApp||mh!==lastModal){
    const ae=document.activeElement, fid=ae&&ae.id, tag=ae&&ae.tagName; let ss=null,se=null;
    try{if(fid&&(tag==='INPUT'||tag==='TEXTAREA')){ss=ae.selectionStart;se=ae.selectionEnd;}}catch(e){}
    if(html!==lastApp){
      const keep={}; app.querySelectorAll('[data-keep]').forEach(el=>{keep[el.dataset.keep]=el.scrollLeft;});
      app.innerHTML=html; lastApp=html;
      app.querySelectorAll('[data-keep]').forEach(el=>{const x=keep[el.dataset.keep];if(x)el.scrollLeft=x;});
    }
    if(mh!==lastModal){const box=document.getElementById('modal');box.innerHTML=mh;lastModal=mh;document.body.classList.toggle('locked',!!mh);if(mh)document.getElementById('toasts').innerHTML='';}
    if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se);}catch(e){}}}
  }
  const nNew=S.orders.filter(o=>o.status==='PLACED').length, nReady=S.orders.filter(o=>o.status==='READY'&&!o.runner).length;
  document.querySelectorAll('.roles button').forEach(b=>{const r=b.dataset.role;b.setAttribute('aria-current',r===U.role?'true':'false');
    const c=r==='vendor'?nNew:r==='runner'?nReady:0, el=b.querySelector('.count'); if(el){el.textContent=c;el.hidden=!c;}});
  paintHeader(); paintTimers(); if(AUTH==='in'||AUTH==='off')celebrate();
}
function paintHeader(){
  const on=AUTH==='off'||AUTH==='in', nav=document.querySelector('.roles'), demoB=document.getElementById('demo-btn'), accB=document.getElementById('acct-btn');
  document.querySelectorAll('.roles button').forEach(b=>{b.hidden=!(on&&canSee(b.dataset.role));});
  nav.hidden=!(on&&views().length>1); demoB.hidden=!(on&&isAdmin());
  accB.hidden=AUTH!=='in';
  if(AUTH==='in'){const h='<span class="av" aria-hidden="true">'+esc(initials(ME.name))+'</span><span class="acct-txt"><b>'+esc(ME.name)+'</b><small>'+esc(ROLE_LABEL[ME.role])+'</small></span>';if(accB.innerHTML!==h)accB.innerHTML=h;}
}
function paintTimers(){
  const now=Date.now();
  document.querySelectorAll('[data-since]').forEach(el=>{el.textContent=dur(now-Number(el.dataset.since));});
  document.querySelectorAll('[data-eta]').forEach(el=>{const m=Math.ceil((Number(el.dataset.eta)-now)/MIN);el.textContent=m>1?'about '+m+' min':m===1?'about a minute':'a moment';});
}
function toast(text,bad){
  const box=document.getElementById('toasts'), el=document.createElement('div'); el.className='toast'+(bad?' bad':''); el.setAttribute('role','status'); el.textContent=text; box.appendChild(el); while(box.children.length>2)box.firstChild.remove();
  setTimeout(()=>el.remove(),2600);
}
const buzz=ms=>{try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}};
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas'), W=cv.width=innerWidth, H=cv.height=innerHeight; cv.className='confetti'; document.body.appendChild(cv);
  const g=cv.getContext('2d'), cols=S.team?['#D1102B','#FFFFFF','#F6C9CF','#8E0A1C','#FFFFFF']:['#C23B45','#DDBF73','#1B1B1D','#FFFFFF','#E0707A'], t0=performance.now();
  const ps=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:5+Math.random()*6,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  (function step(t){const k=(t-t0)/1700; g.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.42;p.x+=p.vx;p.y+=p.vy;p.r+=.2;g.save();g.globalAlpha=Math.max(0,1-k);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);g.restore();});
    if(k<1)requestAnimationFrame(step);else cv.remove();})(t0);
}
/* Confetti and a toast the first time one of this seat's orders is seen as delivered. */
function celebrate(){
  if(!S.customer.session){U.c.seen=null;return;}
  const done=myOrders().filter(o=>o.status==='DELIVERED').map(o=>o.id);
  if(!U.c.seen){U.c.seen=new Set(done);return;}
  if(U.role!=='customer')return;
  const fresh=done.filter(id=>!U.c.seen.has(id)); fresh.forEach(id=>U.c.seen.add(id));
  if(fresh.length){confetti();buzz([30,40,30]);toast('Order #'+fresh[0]+' is at your seat 🎉');}
}
function setRole(r,fromHash){
  if(!ROLES.includes(r)||!canSee(r))return; U.role=r; U.modal=null;
  if(!fromHash){try{if(location.hash!=='#'+r)location.hash=r;}catch(e){}}
  render(); window.scrollTo(0,0);
}
function addToCart(it,qty,mods,unit,note){
  const key=it.id+'|'+mods.join('+')+'|'+note;
  act(()=>{const ex=S.customer.cart.find(l=>l.key===key);if(ex)ex.qty+=qty;else S.customer.cart.push({key,itemId:it.id,qty,unit,mods,note});});
  U.c.pop=it.id; buzz(12); render(); setTimeout(()=>{if(U.c.pop===it.id){U.c.pop=null;render();}},450);
}

/* ---------- actions ---------- */
const A={
  role:d=>setRole(d.role),
  demo:()=>{U.modal={type:'demo'};render();},
  acct:()=>{U.modal={type:'acct'};render();},
  'au-signin':()=>signIn(),
  'au-switch':d=>switchTo(d.id),
  'au-add':()=>{U.modal=null;Object.assign(UA,{adding:true,email:'',pw:'',err:''});AUTH='signin';render();window.scrollTo(0,0);},
  'au-cancel':()=>{Object.assign(UA,{adding:false,pw:'',err:''});AUTH=ME?'in':'signin';render();},
  'au-signout':()=>signOutCurrent(),
  'm-close':()=>{U.modal=null;render();},
  /* customer */
  'c-scan':()=>{if(U.c.scanning)return;U.c.scanning=true;U.c.code='';U.c.codeErr='';render();buzz(15);
    setTimeout(()=>{U.c.scanning=false;act(()=>{S.customer.seat={gate:+U.c.gate,row:+U.c.row,seat:+U.c.seat};S.customer.otp=null;});},650);},
  'c-rescan':()=>act(()=>{S.customer.seat=null;S.customer.otp=null;}),
  'c-otp':()=>{U.c.code='';U.c.codeErr='';act(()=>{S.customer.otp=String(1000+Math.floor(Math.random()*9000));});toast('Code sent');},
  'c-verify':()=>{
    if(!S.customer.otp||S.customer.session)return;
    if(U.c.code.trim()!==S.customer.otp){U.c.codeErr='That code doesn’t match. Check the 4 digits and try again.';render();return;}
    U.c.screen='home';U.c.codeErr='';U.c.code='';U.c.q='';U.c.cat=null;U.c.seen=null;
    act(()=>{const seat=S.customer.seat;S.customer.session={token:Math.random().toString(36).slice(2,10),seat,phone:U.c.phone,started:Date.now()};S.customer.otp=null;S.customer.cart=[];
      logEv('Seat session opened at '+seatStr(seat));});
    window.scrollTo(0,0);
  },
  'c-end':()=>{U.c.screen='home';act(()=>{S.customer.session=null;S.customer.seat=null;S.customer.otp=null;S.customer.cart=[];});toast('Session ended');},
  'c-go':d=>{U.c.screen=d.to==='vendors'?'home':d.to;U.c.err='';render();window.scrollTo(0,0);},
  'c-vendor':d=>{U.c.vendor=d.id;U.c.screen='store';render();window.scrollTo(0,0);},
  'c-cat':d=>{U.c.cat=U.c.cat===d.id?null:d.id;render();},
  'c-clear':()=>{U.c.cat=null;U.c.q='';render();},
  'c-item':d=>{const it=itemOf(d.id);if(!it||!avail(it))return;U.modal={type:'item',itemId:d.id,qty:1,mods:{},sel:1,note:'',noteOpen:false};render();},
  'c-quick':d=>{const it=itemOf(d.id);if(!it||!avail(it))return;if(it.opts){A['c-item'](d);return;}addToCart(it,1,[],it.price,'');},
  'm-note-open':()=>{U.modal.noteOpen=true;render();const el=document.getElementById('m-note');if(el)el.focus();},
  'm-sel':d=>{U.modal.sel=Number(d.i);render();},
  'm-qty':d=>{const m=U.modal;m.qty=Math.max(1,Math.min(20,m.qty+Number(d.d)));render();},
  'm-add':()=>{
    const m=U.modal, it=itemOf(m.itemId), picked=it.one?[it.opts[m.sel]]:(it.opts||[]).filter((o,i)=>m.mods[i]);
    U.modal=null; addToCart(it,m.qty,picked.map(o=>o[0]),r2(it.price+picked.reduce((a,o)=>a+o[1],0)),(m.note||'').trim());
  },
  'c-qty':d=>act(()=>{const c=S.customer.cart,i=c.findIndex(l=>l.key===d.key);if(i<0)return;c[i].qty+=Number(d.d);if(c[i].qty<=0)c.splice(i,1);}),
  'c-pay':d=>{U.c.pay=d.p;render();},
  'c-checkout':()=>{
    const cart=S.customer.cart, u=U.c; if(!cart.length||u.paying)return;
    const closed=[...new Set(cart.map(l=>itemOf(l.itemId).v))].filter(v=>!canOrder(v)).map(v=>vendorOf(v).name);
    if(closed.length){u.err=closed.join(' and ')+' stopped taking orders. Remove those items to pay.';render();return;}
    if(cart.some(l=>S.soldOut[l.itemId])){u.err='Something in your basket just sold out. Remove it to pay.';render();return;}
    if(cart.some(l=>itemOf(l.itemId).alc)&&!u.age){u.err='Confirm you’re 18 or older to order alcohol.';render();return;}
    u.err='';u.paying=true;render();
    setTimeout(()=>{u.paying=false;u.age=false;u.screen='orders';
      const ids=act(()=>{const c=S.customer;const r=placeOrders(c.cart,c.session.seat,c.session.token,u.pay);c.cart=[];return r;});
      window.scrollTo(0,0);confetti();buzz(25);toast('Payment confirmed. '+(ids.length>1?ids.length+' orders':'Order #'+ids[0])+' sent.');
    },900);
  },
  'c-receipt':d=>{U.modal={type:'receipt',id:d.id};render();},
  'c-rate':d=>{act(()=>{const o=getOrder(d.id);if(o&&!o.rating){o.rating=Number(d.n);logEv('#'+o.id+' rated '+o.rating+' of 5 by the customer');}});toast('Thanks for the '+d.n+' ★');},
  'c-again':d=>{
    const o=getOrder(d.id); if(!o)return; let added=0, skipped=0;
    act(()=>{o.lines.forEach(l=>{const it=itemOf(l.itemId);if(!it||!avail(it)){skipped++;return;}
      const key=it.id+'|'+l.mods.join('+')+'|'+(l.note||''), ex=S.customer.cart.find(x=>x.key===key);
      if(ex)ex.qty+=l.qty;else S.customer.cart.push({key,itemId:it.id,qty:l.qty,unit:l.unit,mods:l.mods.slice(),note:l.note||''});added++;});});
    if(added){U.c.screen='cart';render();window.scrollTo(0,0);}
    toast(added?(skipped?'Added what’s still available':'Added to your basket'):'Those items aren’t available right now',!added);
  },
  /* vendor */
  'v-tab':d=>{U.v.tab=d.t;render();},
  'v-status':d=>act(()=>setVendorStatus(S.vendorId,d.m)),
  'v-stock':d=>act(()=>toggleStock(d.id)),
  'v-step':d=>{const ok=act(()=>vendorStep(d.id,d.to));if(!ok)toast('Order #'+d.id+' has already moved on',true);},
  'v-delay':d=>{if(act(()=>vendorDelay(d.id,5)))toast('Customer told: 5 min later');},
  /* runner */
  'r-login':d=>act(()=>{S.runnerId=d.id;}),
  'r-logout':()=>{U.r.tab='orders';act(()=>{S.runnerId=null;});},
  'r-shift':()=>act(()=>{const r=S.runners[S.runnerId];r.onShift=!r.onShift;logEv('Runner #'+S.runnerId+(r.onShift?' is AVAILABLE':' went off shift'));}),
  'r-tab':d=>{U.r.tab=d.t;render();},
  'r-accept':d=>{
    U.r.reveal=d.id; const res=act(()=>runnerAccept(d.id,S.runnerId));
    if(res.ok){buzz(20);toast('Order #'+d.id+' is yours');setTimeout(()=>{U.r.reveal=null;},1200);}else{U.r.reveal=null;toast(res.msg,true);}
  },
  'r-step':d=>{const ok=act(()=>runnerStep(d.id,S.runnerId,d.to));if(ok&&d.to==='DELIVERED')toast('Delivered. You’re available again.');},
  'r-fail':d=>{U.r.reason=REASONS[0];U.modal={type:'fail',id:d.id};render();},
  'm-fail':()=>{const id=U.modal.id;U.modal=null;act(()=>runnerStep(id,S.runnerId,'FAILED',U.r.reason));toast('Failed delivery reported');},
  /* demo */
  'd-team':()=>{act(()=>{S.team=!S.team;logEv(S.team?'Sports event: home team colours on':'Default theme on');});},
  'd-auto':d=>act(()=>{S.auto[d.k]=!S.auto[d.k];logEv('Autopilot for '+d.k+(S.auto[d.k]?' on':' off'));}),
  'd-live':()=>{const n=act(()=>genLive(5));toast(n+' simulated orders placed');},
  'd-hist':()=>{act(()=>genHistory(25));toast('25 completed orders added');},
  'd-race':()=>{const r=act(()=>simulateRace());if(r.err){toast(r.err,true);return;}U.modal={type:'race',order:r.order,results:r.results};render();},
  'd-reset':()=>{act(()=>{const team=!!S.team,f=freshState();for(const k in f)if(k!=='rev')S[k]=f[k];S.team=team;});U.modal=null;Object.assign(U.c,{screen:'home',vendor:null,code:'',err:'',q:'',cat:null,seen:null});U.r.tab='orders';U.v.tab='orders';render();toast('Demo data reset');}
};
const C={
  'c-seat':(d,el)=>{U.c[d.k]=Number(el.value);render();},
  'c-age':(d,el)=>{U.c.age=el.checked;U.c.err='';render();},
  'v-store':(d,el)=>{if(isAdmin())act(()=>{S.vendorId=el.value;});},
  'a-status':(d,el)=>{U.a.status=el.value;render();},
  'm-mod':(d,el)=>{U.modal.mods[d.i]=el.checked;render();},
  'm-reason':d=>{U.r.reason=d.r;}
};
const I={
  'c-phone':(d,el)=>{U.c.phone=el.value;},
  'au-email':(d,el)=>{UA.email=el.value;},
  'au-pw':(d,el)=>{UA.pw=el.value;},
  'c-code':(d,el)=>{U.c.code=el.value.replace(/\D/g,'').slice(0,4);if(el.value!==U.c.code)el.value=U.c.code;if(U.c.code.length===4)A['c-verify']();},
  'c-q':(d,el)=>{U.c.q=el.value;render();},
  'm-note':(d,el)=>{if(U.modal)U.modal.note=el.value;}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el||el.disabled)return;
  const a=el.dataset.action;
  if(a==='m-veil'){if(e.target===el){U.modal=null;render();}return;}
  if(A[a]&&allowedAction(a))A[a](el.dataset,el);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&C[el.dataset.change])C[el.dataset.change](el.dataset,el);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(el&&I[el.dataset.input])I[el.dataset.input](el.dataset,el);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&U.modal){U.modal=null;render();}
  if(e.key==='Enter'&&e.target.id==='c-code'){A['c-verify']();}
  if(e.key==='Enter'&&(e.target.id==='au-pw'||e.target.id==='au-email')){e.preventDefault();signIn();}
});
window.addEventListener('storage',e=>{if(!CLOUD&&e.key===KEY){const o=load();if(o){S=o;render();}}});
window.addEventListener('hashchange',()=>{const r=location.hash.replace('#','');if(ROLES.includes(r)&&r!==U.role)setRole(r,true);});

/* ---------- boot ---------- */
S=load()||freshState(); save();
(function(){const r=location.hash.replace('#','');if(ROLES.includes(r))U.role=r;})();
if(S.customer.session&&!S.customer.session.seat)S.customer.session=null;
render();
{const nb=document.createElement('div');nb.id='net-badge';document.body.appendChild(nb);setNet(netState);}
if(sb)authBoot();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{if(AUTH!=='in'&&AUTH!=='off')return;if(commit(autoStep,true))render();else paintTimers();},1000);
})();
</script>
